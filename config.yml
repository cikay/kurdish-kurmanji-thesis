stages:
  - download
  - extract
  - normalize
  - clean
  - stats
  - filter

download:
  description: Search YÖK Tez Merkezi, download PDFs, write manifest.jsonl

extract:
  description: Extract plain text from PDFs, write txt files and manifest.jsonl

normalize:
  description: Normalize text to NFC, write theses_normalized.csv

clean:
  description: Filter to Kurmanji-only paragraphs, write theses_clean.csv

stats:
  description: Compute per-thesis word counts, write manifest.jsonl

filter:
  description: Discard theses below minimum word count, write manifest.jsonl
  min_word_count: 100
